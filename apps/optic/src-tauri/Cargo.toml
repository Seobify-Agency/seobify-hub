[package]
name = "cwebp-visual-optimizer"
version = "0.2.1"
description = "Seobify Optic — Visual SEO & Image Privacy Studio"
authors = ["Seobify Agency"]
license = "AGPL-3.0-only"
repository = "https://github.com/Seobify-Agency/seobify-hub"
edition = "2021"
rust-version = "1.88"
default-run = "cwebp-visual-optimizer"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["process", "fs", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
which = "7"
base64 = "0.22"
tempfile = "3"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rustfft = "6"
rand = "0.8"
sha2 = "0.10"
flate2 = "1"
crc32fast = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.36"
lopdf = { version = "0.46", default-features = false }

[[bin]]
name = "cwebp-mcp"
path = "src/bin/cwebp_mcp.rs"

[[bin]]
name = "seobify-optic-mcp"
path = "src/bin/seobify_optic_mcp.rs"

# The DSP pipeline (FFT, median filters, resampling) is far too slow unoptimised; keep
# dev builds debuggable but optimised, and optimise dependencies fully.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
